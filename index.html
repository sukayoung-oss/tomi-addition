<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>또미의 덧셈 톡톡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  /* 유아용 디자인 시스템 토큰 (PRD 디자인 시스템) */
  :root{
    /* 스티커 팔레트: 핫핑크 · 오렌지 · 퍼플 · 라임 · 스카이블루 */
    --pink:#EC5A8A; --pink-deep:#C93A6C; --orange:#F28C38; --orange-deep:#D06E1E;
    --purple:#8F63E8; --purple-deep:#6C42C9; --lime:#B8DC3F; --lime-deep:#8DB22A; --sky:#78AEF0; --sky-deep:#4F8BD8;
    --bg:#EEF1F8; --surface:#FFFFFF; --ink:#1F1A1C; --ink-soft:#5E5660;
    --num-a:#E4467D; --num-a-soft:#FDE3EC; --num-b:#3E86E0; --num-b-soft:#E3EEFC;
    --choice:#FFFFFF; --choice-edge:#D9D3E4;
    --good:#5E9A12; --good-soft:#F0F8DA; --oops:#D93A6E; --oops-soft:#FDE6EF;
    --star:#B8DC3F; --star-edge:#8DB22A; --primary:#8F63E8; --primary-edge:#6C42C9;
    --r-card:24px; --r-btn:20px; --r-full:9999px;
    --edge:5px; --press:4px;
    --font:'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  }
  [hidden]{display:none !important;}
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:var(--font); user-select:none; -webkit-user-select:none;}
  body{font-variant-numeric:tabular-nums;}
  button{font-family:inherit; color:inherit; cursor:pointer; touch-action:manipulation;}

  /* 입체 버튼 */
  .btn3d{border:none; border-radius:var(--r-btn); box-shadow:0 var(--edge) 0 var(--e, var(--choice-edge)); transition:transform .08s, box-shadow .08s, background-color .15s;}
  .btn3d:active:not(:disabled){transform:translateY(var(--press)); box-shadow:0 1px 0 var(--e, var(--choice-edge));}

  .app{width:100%; height:100vh; height:100dvh; display:flex; flex-direction:column;
    padding:max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));}
  .screen{display:none; flex:1; min-height:0; flex-direction:column;}
  .screen.on{display:flex;}

  /* ---------- 시작 화면 (시안 C) ---------- */
  #home{flex-direction:row; gap:clamp(14px, 3vmin, 28px); min-height:0; padding:clamp(4px, calc(7.5vmin - 12px), 48px) clamp(2px, calc(7.5vmin - 16px), 44px);}
  .pick{flex:1; min-width:0; display:flex; flex-direction:column; gap:clamp(10px, 2.2vh, 22px); overflow-y:auto; padding-bottom:6px;}
  /* 제목: 또미(가슴 위) + 또미의 덧셈 톡톡. 또미 아래쪽은 분홍 판 뒤로 살짝 숨김 */
  #home{--hh:clamp(84px, 15vh, 124px); --tuck:clamp(10px, 2.2vh, 18px);}
  .brand{flex:0 0 auto; height:var(--hh); display:flex; align-items:flex-end; gap:clamp(10px, 1.4vw, 16px); margin-bottom:calc(-1 * var(--tuck)); position:relative; z-index:0;}
  .brand-tomi{display:block; height:calc(var(--hh) + var(--tuck) * .67 - 6px); width:auto; margin-bottom:calc(-1 * var(--tuck) * .67); transform-origin:50% 100%;}
  .brand-tomi.hi{animation:tomi-hi 2.6s ease-in-out 1;}
  @keyframes tomi-hi{0%{transform:rotate(0) translateY(0)} 12%{transform:rotate(-8deg) translateY(-6px)} 26%{transform:rotate(7deg) translateY(-6px)} 40%{transform:rotate(-6deg) translateY(-3px)} 54%{transform:rotate(4deg) translateY(-2px)} 66%,100%{transform:rotate(0) translateY(0)}}
  @media (prefers-reduced-motion: reduce){ .brand-tomi.hi{animation:none;} }
  .title{font-size:clamp(26px, min(6vh, 4vw), 52px); margin:0; font-weight:400; line-height:1; padding-bottom:calc(var(--tuck) + clamp(8px, 2vh, 16px)); white-space:nowrap;}
  .pick .panel{position:relative; z-index:1;}
  @media (orientation:landscape) and (min-height:501px){ .pick{overflow:visible;} }
  .panel{border-radius:var(--r-card); padding:clamp(12px, 2.6vh, 28px) clamp(14px, 2.4vw, 28px) clamp(14px, 3vh, 30px); display:flex; flex-direction:column; gap:clamp(8px, 1.6vh, 16px);}
  .panel.stage{background:var(--pink); color:#fff; --e:var(--pink-deep); border:4px solid #fff; box-shadow:0 6px 0 rgba(0,0,0,.08); flex:1 1 auto; justify-content:space-evenly;}
  .panel.count{background:var(--orange); color:#fff; border:4px solid #fff; box-shadow:0 6px 0 rgba(0,0,0,.08); flex:0 0 auto; flex-direction:row; align-items:center; gap:clamp(12px, 1.8vw, 22px); --e:var(--orange-deep);}
  .phead{display:flex; align-items:center; gap:10px; flex:0 0 auto;}
  .badge{background:#fff !important; width:clamp(28px, min(4.6vh, 3.2vw), 44px); height:clamp(28px, min(4.6vh, 3.2vw), 44px); border-radius:var(--r-full); color:#fff; display:inline-flex; align-items:center; justify-content:center; font-size:clamp(16px, 2.6vh, 24px);}
  .stage .badge{color:var(--pink-deep);} .count .badge{color:var(--orange-deep);}
  .phead h2{margin:0; font-size:clamp(19px, min(3.4vh, 2.4vw), 32px); font-weight:400;}
  .sub{color:#fff; margin:0 0 clamp(6px, 1.2vh, 12px); font-size:clamp(15px, min(2.6vh, 1.8vw), 24px);}
  .divider{height:2px; background:rgba(255,255,255,.45); border-radius:var(--r-full); margin:2px 0;}
  .row5{display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:10px;}
  .row2{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px;}
  .row3{flex:1; display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:10px;}
  .opt{color:var(--ink); min-height:64px; height:clamp(64px, min(10.8vh, 7.6vw), 120px); font-size:clamp(20px, min(4.4vh, 3vw), 42px); background:var(--surface); border-radius:var(--r-full); padding:0 6px;}
  .opt{border:4px solid transparent !important;}
  .stage .opt.sel{background:var(--pink-deep); --e:#9E2752; color:#fff; border-color:#fff !important;}
  .count .opt{white-space:nowrap; font-size:clamp(21px, min(4.8vh, 2.7vw), 46px); padding:0 4px;}
  .count .opt.sel{background:var(--orange-deep); --e:#A5550F; color:#fff; border-color:#fff !important;}

  .preview{width:42%; min-width:280px; flex:0 0 auto; background:var(--surface); border:4px solid #fff; outline:2px solid #E3DDEC; border-radius:28px; box-shadow:0 6px 0 rgba(0,0,0,.08);
    padding:clamp(14px, 3.4vh, 36px) clamp(16px, 2.6vw, 36px); display:flex; flex-direction:column; gap:clamp(10px, 2vh, 20px); min-height:0;}
  .pv-head{display:flex; justify-content:space-between; align-items:center; gap:10px; font-size:clamp(15px, min(2.8vh, 1.8vw), 26px);}
  .pv-sel{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; font-size:clamp(14px, min(2.4vh, 1.55vw), 22px);}
  @media (orientation:portrait){ .pv-sel{font-size:clamp(14px, 3vw, 22px);} }
  .pv-chip{white-space:nowrap; background:var(--sky); color:#fff; border-radius:var(--r-full); padding:6px 14px;}
  .pv-body{flex:1; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:clamp(8px, 2.4vmin, 18px); text-align:center;}
  .pv-prob{font-size:clamp(40px, min(15vh, 6.6vw), 150px); line-height:1; display:grid; grid-template-columns:repeat(5, auto); align-items:center; justify-items:center; column-gap:.16em; row-gap:clamp(8px, 1.8vh, 18px);}
  .pv-prob .q{width:1.1em; height:1.1em; border:4px dashed #C9C0D6; border-radius:.24em; display:inline-flex; align-items:center; justify-content:center; color:#9A8FAA; font-size:.78em;}
  .pv-prob .na{color:var(--num-a);} .pv-prob .nb{color:var(--num-b);}
  .pv-prob .dcell{--d:clamp(11px, min(3.2vh, 1.7vw), 30px);}
  .pv-desc{margin:0; font-size:clamp(16px, min(3.2vh, 1.9vw), 30px); word-break:keep-all;}
  .record{font-size:15px; color:var(--ink-soft); margin:0; min-height:18px;}
  .start{min-height:64px; height:clamp(64px, min(12vh, 8vw), 120px); width:100%; font-size:clamp(22px, min(4.8vh, 3.2vw), 44px); background:var(--purple); color:#fff; --e:var(--purple-deep); display:flex; align-items:center; justify-content:center; gap:12px;}

  @media (max-height:500px){
    #home{padding:4px 2px;}
    .title{display:none;} .brand{display:none;}
    .panel{gap:8px; padding:10px 14px 14px;}
    .sub{display:none;}
    .stage .rowwrap{display:flex; align-items:center; gap:10px;}
    .stage .rowwrap .tag{color:#fff; display:inline-block; width:58px; flex:0 0 auto; font-size:15px; line-height:1.2;}
    .opt{min-height:56px;}
    .pv-head{font-size:15px;} .preview{gap:8px;} .start{min-height:60px;}
    .pv-prob{font-size:clamp(40px, 15vh, 64px);}
  }
  @media (min-height:501px){ .tag{display:none;} }
  @media (orientation:portrait){
    #home{flex-direction:column; overflow-y:auto;}
    .panel.stage{flex:0 0 auto;}
    .pick{overflow:visible; flex:0 0 auto;}
    .preview{width:auto; min-width:0; flex:1 0 auto; min-height:250px; padding:14px 16px; gap:8px;}
    .pv-body{gap:8px; flex:1 0 auto;}
    .panel{padding:12px 14px 14px;}
    .opt{height:clamp(64px, 8.5vw, 96px); font-size:clamp(20px, 4.4vw, 40px);}
    .phead h2{font-size:clamp(19px, 3.6vw, 30px);} .sub{font-size:clamp(15px, 2.8vw, 22px);} .title{font-size:clamp(26px, 6vw, 48px);}
    .badge{width:clamp(28px, 5vw, 44px); height:clamp(28px, 5vw, 44px);}
    .pv-prob{font-size:clamp(44px, 11vw, 120px);} .pv-prob .dcell{--d:clamp(11px, 3vw, 26px);} .pv-desc{font-size:clamp(16px, 3.4vw, 28px);} .pv-head{font-size:clamp(15px, 3vw, 24px);}
    .start{height:clamp(60px, 9vw, 96px); font-size:clamp(22px, 5vw, 40px); flex:0 0 auto;}
    .panel.count{flex-direction:column; align-items:stretch; gap:10px;}
    .row3{flex:0 0 auto;}
  }

  /* 미리 보기 박스 위·아래 선을 왼쪽 판(단계 고르기 ~ 문제 수)에 맞춤 */
  #home .preview{margin-top:calc(var(--hh) - var(--tuck) + clamp(10px, 2.2vh, 22px)); margin-bottom:6px;}
  @media (max-height:500px){ #home .preview{margin-top:0;} }
  @media (orientation:portrait){ #home .preview{margin-top:0; margin-bottom:0;} #home{--hh:clamp(60px, 15vw, 96px);} }

  /* ---------- 문제 화면 ---------- */
  #play{gap:clamp(6px, 1.6vmin, 12px);}
  .top{display:flex; align-items:center; gap:12px;}
  .home-btn{width:64px; height:56px; flex:0 0 auto; font-size:26px; background:var(--surface); --e:var(--choice-edge); border-radius:18px;}
  .where{font-size:clamp(16px, 4.2vmin, 26px); flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  @media (max-width:520px){ .qpill{display:none !important;} .where{white-space:normal; font-size:16px; line-height:1.2; word-break:keep-all;} }
  .pill{background:var(--surface); border-radius:var(--r-full); padding:8px 16px; font-size:clamp(16px, 3.8vmin, 22px); box-shadow:0 4px 0 rgba(0,0,0,.06);}
  .progress{height:12px; background:#DCD6E6; border-radius:var(--r-full); overflow:hidden; flex:0 0 auto;}
  .progress > div{height:100%; width:0; background:var(--orange); border-radius:var(--r-full); transition:width .35s;}
  .card{flex:1; min-height:0; background:var(--surface); border-radius:var(--r-card); border:4px solid #fff; outline:2px solid #E3DDEC; box-shadow:0 6px 0 rgba(0,0,0,.08); position:relative; overflow:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:center; padding:clamp(6px, 1.6vmin, 16px); transition:background-color .2s;}
  .card.good{background:var(--good-soft);} .card.bad{background:var(--oops-soft);}
  .problem{font-size:clamp(40px, min(18vh, 14vw), 150px); line-height:1.05; display:grid; grid-template-columns:repeat(5, auto); align-items:center; justify-items:center; column-gap:.18em; row-gap:clamp(6px, 1.6vh, 16px);}
  .dcell{--d:clamp(12px, 4vmin, 30px); font-size:16px; line-height:1; align-self:start; display:flex; justify-content:center;}
  .problem .dcell{--d:clamp(12px, min(4.4vh, 3.2vw), 32px);}
  .na{color:var(--num-a);} .nb{color:var(--num-b);}
  .ans{min-width:1.3em; height:1.15em; border:4px dashed #C9C0D6; border-radius:.22em; display:inline-flex; align-items:center; justify-content:center; color:#B3A9C2;}
  .ans.done{border-style:solid; border-color:var(--good); color:var(--ink);}
  .dots{--d:clamp(12px, 4vmin, 30px); display:flex; align-items:center; justify-content:center; gap:calc(var(--d)*.7); flex-wrap:wrap; margin-top:clamp(4px, 1.4vmin, 12px);}
  .dgroup{display:grid; gap:calc(var(--d)*.25);}
  .dot{width:var(--d); height:var(--d); border-radius:50%;}
  .dot.a{background:var(--pink);} .dot.b{background:var(--sky);}
  .dzero{font-size:calc(var(--d)*1.1); color:var(--ink-soft);}
  .dplus{font-size:calc(var(--d)*1.2); color:var(--ink-soft);}
  .hint-btn{position:absolute; right:clamp(8px, 1.6vmin, 14px); bottom:clamp(8px, 1.6vmin, 14px); min-height:48px; padding:0 16px; font-size:clamp(15px, 3.4vmin, 19px);
    background:var(--sky); color:#fff; --e:var(--sky-deep); border-radius:var(--r-full); --edge:4px;}
  .msg{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;} /* 화면에는 안 보이고 화면 읽기 프로그램만 읽음 */
  .msg.ok{color:var(--good);} .msg.no{color:var(--oops);}
  .choices{display:grid; grid-template-columns:repeat(5, 1fr); gap:clamp(8px, 2vmin, 16px); flex:0 0 auto; padding-bottom:var(--edge);}
  .choice{height:clamp(64px, 17vmin, 120px); font-size:clamp(32px, 9vmin, 60px); background:var(--choice); --e:var(--choice-edge); position:relative;}
  .choice:nth-child(1){--bc:var(--pink);} .choice:nth-child(2){--bc:var(--orange);} .choice:nth-child(3){--bc:var(--purple);} .choice:nth-child(4){--bc:var(--lime-deep);} .choice:nth-child(5){--bc:var(--sky);}
  .choice{border:4px solid var(--bc); --e:rgba(31,26,28,.12);}
  .choice .mark{position:absolute; top:6px; right:10px; font-size:.42em; line-height:1;}
  .choices .choice.right{background:var(--lime); color:var(--ink); --bc:var(--lime-deep); --e:var(--lime-deep);}
  .choices .choice.wrong{background:var(--oops-soft); color:var(--oops); --bc:#F3BCD0; --e:#F3BCD0;}
  .choice:disabled{cursor:default;}
  .choice.wrong:disabled, .choice.dim{opacity:.55;}
  .choice.right:disabled{opacity:1;}

  /* ---------- 결과 화면 ---------- */
  /* 결과 화면 (시안 A · 스티커 또미) */
  #result.on{flex-direction:row; align-items:center; justify-content:center; gap:clamp(16px, 4vw, 48px); overflow-y:auto; padding:clamp(4px, 2vmin, 28px) clamp(4px, 3vw, 40px);}
  .res-art{position:relative; flex:0 0 auto; height:min(82vh, 520px); aspect-ratio:348/459; max-width:42vw;}
  .res-tomi{width:100%; height:100%; object-fit:contain; transform:rotate(-4deg); display:block;}
  .spark{position:absolute;}
  .spark.s1{left:-2%; top:28%; width:11%;}
  .spark.s2{right:6%; top:66%; width:11%;}
  .spark.s3{right:4%; top:4%; width:20%;}
  .res-info{flex:0 1 auto; min-width:0; max-width:560px; display:flex; flex-direction:column; align-items:flex-start; gap:clamp(8px, 2.2vh, 20px); text-align:left;}
  .res-chip{background:#fff; border-radius:var(--r-full); padding:8px 18px; font-size:clamp(15px, 2.4vh, 20px);}
  .res-title{font-size:clamp(34px, min(10vh, 6.4vw), 72px); margin:0; line-height:1.1;}
  .res-sub{font-size:clamp(16px, 3vh, 24px); color:var(--ink-soft); margin:0; word-break:keep-all;}
  .stars{display:flex; flex-wrap:wrap; gap:6px; max-width:520px;}
  .res-btns{display:flex; gap:12px; flex-wrap:wrap; margin-top:clamp(0px, 1.2vh, 12px);}
  @media (orientation:portrait){
    #result.on{flex-direction:column; justify-content:safe center;}
    .res-art{height:min(40vh, 420px); max-width:80vw;}
    .res-info{align-items:center; text-align:center;}
    .stars,.res-btns{justify-content:center;}
  }








  .res-btns .start{width:auto; padding:0 32px;}
  .ghost{min-height:72px; padding:0 28px; font-size:22px; background:var(--surface); --e:var(--choice-edge);}

  .ico{width:1em; height:1em; vertical-align:-0.14em; flex:0 0 auto;}
  .home-btn{display:inline-flex; align-items:center; justify-content:center; color:var(--ink);}
  .home-btn .ico{width:30px; height:30px;}
  .pill{display:inline-flex; align-items:center; gap:6px;}
  .star-ico{width:1.15em; height:1.15em;}
  .hint-btn{display:inline-flex; align-items:center; gap:8px;}
  .hint-btn .ico{width:1.15em; height:1.15em;}
  .burst svg{width:30px; height:30px; display:block;}
  .res-emoji svg{width:clamp(96px, 26vmin, 170px); height:auto; display:block; margin:0 auto;}
  .rstar{width:clamp(28px, min(8vh, 5vw), 52px); height:clamp(28px, min(8vh, 5vw), 52px);}
  .res-btns .start{display:inline-flex; align-items:center; gap:10px;}
  .res-btns button{height:72px; min-height:72px; width:auto; padding:0 32px; font-size:clamp(20px, 4.2vmin, 26px);}
  /* 정답 축하 이펙트: 불꽃놀이 폭죽(A) + 칭찬 리본(B) */
  .fx{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:50;}
  .fx canvas{position:absolute; inset:0; width:100%; height:100%;}
  /* 칭찬 리본: 가운데 띠 + 뒤로 접힌 제비꼬리 양끝 */
  .ribbon{position:absolute; left:50%; top:-20%; transform:translateX(-50%); z-index:1; white-space:nowrap; color:#fff;
    font-size:clamp(28px, 7vmin, 64px); filter:drop-shadow(0 .09em 0 rgba(31,26,28,.14)); animation:ribbon 1.9s cubic-bezier(.3,1.5,.5,1) forwards;}
  .rb-band{position:relative; z-index:2; display:block; background:var(--pink); padding:.16em .95em .2em; border-radius:.16em; line-height:1.15;
    box-shadow:inset 0 -.08em 0 rgba(0,0,0,.08);}
  .rb-tail{position:absolute; z-index:0; top:.34em; width:1.05em; height:100%; background:var(--pink-deep);}
  .rb-tail.l{left:-.78em; clip-path:polygon(0 0, 100% 0, 100% 100%, 0 100%, 34% 50%);}
  .rb-tail.r{right:-.78em; clip-path:polygon(0 0, 100% 0, 66% 50%, 100% 100%, 0 100%);}
  .rb-fold{position:absolute; z-index:1; top:100%; width:.27em; height:.34em; background:#8E2350;}
  .rb-fold.l{left:0; clip-path:polygon(0 0, 100% 0, 100% 100%);}
  .rb-fold.r{right:0; clip-path:polygon(0 0, 100% 0, 0 100%);}
  @keyframes ribbon{0%{top:-20%;} 25%{top:calc(var(--rt, 12vh) + 14px);} 34%{top:calc(var(--rt, 12vh) - 8px);} 50%,80%{top:var(--rt, 12vh); opacity:1;} 100%{top:var(--rt, 12vh); opacity:0;}}
  @media (prefers-reduced-motion: reduce){ .ribbon{animation:none; top:var(--rt, 12vh);} }
  /* 움직임 */
  .shake{animation:shake .4s;}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
  .pop{animation:pop .45s;}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
  .burst{position:absolute; left:50%; top:45%; pointer-events:none; animation:fly .9s ease-out forwards;}
  @keyframes fly{from{opacity:1; transform:translate(-50%,-50%) scale(.6)} to{opacity:0; transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.3)}}
  @media (prefers-reduced-motion: reduce){
    .shake,.pop{animation:none;} .burst{display:none;}
    .btn3d:active:not(:disabled){transform:none;}
  }

<script>
(function(){
  const $ = id => document.getElementById(id);

  // 단계 탭 (PRD 단계 탭 구성)
  const TABS = [
    {id:'p1', label:'+1', fixed:1}, {id:'p2', label:'+2', fixed:2}, {id:'p3', label:'+3', fixed:3},
    {id:'p4', label:'+4', fixed:4}, {id:'p5', label:'+5', fixed:5},
    {id:'r5', label:'0~5', max:5}, {id:'r9', label:'0~9', max:9}
  ];

  const store = {
    get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
    set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  };

  // ---------- 아이콘 · 일러스트 (이모지 대신 SVG) ----------
  const STAR_D = 'M12 2.8l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 16.8l-5.5 2.9 1-6.1-4.4-4.3 6.1-.9z';
  const ICON = {
    eye: '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
    eyeOff: '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7c2 0 3.8.7 5.2 1.6M22 12s-3.6 7-10 7c-2 0-3.8-.7-5.2-1.6"/><path d="M4 4l16 16"/></svg>'
  };
  const starSvg = on => '<svg class="rstar" viewBox="0 0 24 24" aria-hidden="true"><path d="' + STAR_D + '" fill="' + (on ? '#FFCC33' : '#FFFFFF') + '" stroke="#EFBD26" stroke-width="1.6" stroke-linejoin="round"/></svg>';
  const SPARK = 'M12 2c.6 4.6 2.4 6.4 7 7-4.6.6-6.4 2.4-7 7-.6-4.6-2.4-6.4-7-7 4.6-.6 6.4-2.4 7-7z';
  const BURST = [
    '<svg viewBox="0 0 24 24"><path d="' + STAR_D + '" fill="#FFCC33" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg>',
    '<svg viewBox="0 0 24 24"><path d="' + SPARK + '" fill="#EC5A8A"/></svg>',
    '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7" fill="#F28C38" stroke="#fff" stroke-width="2"/></svg>',
    '<svg viewBox="0 0 24 24"><path d="' + STAR_D + '" fill="#8F63E8" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg>',
    '<svg viewBox="0 0 24 24"><path d="' + SPARK + '" fill="#78AEF0"/></svg>'
  ];
  // 결과 화면 캐릭터: 스티커 같은 동글이 (기분별 색 · 표정 · 팔)
  function mascot(mood){
    const c = {full:'#B8DC3F', good:'#F28C38', try:'#78AEF0'}[mood];
    const mouth = mood === 'try'
      ? '<path d="M52 72q8 6 16 0" fill="none" stroke="#1F1A1C" stroke-width="3.2" stroke-linecap="round"/>'
      : '<path d="M47 68q13 16 26 0z" fill="#1F1A1C"/><path d="M53 74q7 5 14 0" fill="#EC5A8A"/>';
    const arms = mood === 'try'
      ? '<path d="M24 66q-10 6-12 16" /><path d="M96 60q12-6 14-20" />'
      : '<path d="M24 60q-12-6-14-20" /><path d="M96 60q12-6 14-20" />';
    return '<svg viewBox="0 0 120 130" role="img" aria-label="' + ({full:'만점', good:'잘했어요', try:'다시 해 봐요'}[mood]) + '">' +
      '<g fill="none" stroke="#1F1A1C" stroke-width="3.2" stroke-linecap="round">' + arms + '<path d="M50 104v14h-6M70 104v14h6"/></g>' +
      '<path d="M60 14c23 0 40 17 40 42 0 27-17 48-40 48S20 83 20 56c0-25 17-42 40-42z" fill="' + c + '" stroke="#fff" stroke-width="6"/>' +
      '<ellipse cx="49" cy="54" rx="5" ry="7" fill="#1F1A1C"/><ellipse cx="71" cy="54" rx="5" ry="7" fill="#1F1A1C"/>' +
      '<circle cx="51" cy="51" r="1.8" fill="#fff"/><circle cx="73" cy="51" r="1.8" fill="#fff"/>' +
      '<circle cx="38" cy="66" r="5" fill="#EC5A8A" opacity=".45"/><circle cx="82" cy="66" r="5" fill="#EC5A8A" opacity=".45"/>' + mouth +
      '<path d="' + SPARK + '" transform="translate(88 6) scale(1.1)" fill="#8F63E8"/>' +
      (mood === 'full' ? '<path d="' + SPARK + '" transform="translate(6 18) scale(.8)" fill="#EC5A8A"/>' : '') +
      '</svg>';
  }

  // 처음 열면 항상 '+1 하나씩 더하기 / 5문제'로 시작 (한 번 열어 둔 동안에는 고른 값이 유지됨)
  let tab = TABS[0];
  let total = 5;
  if(![5,10,20].includes(total)) total = 10;

  // 상태
  let qi = 0, score = 0, a = 0, b = 0, answer = 0, firstTry = true, locked = false;
  let wrongs = [], lastPair = '', lastPos = -1, timer = null, opts = [];

  // ---------- 시작 화면 ----------
  function renderTabs(){
    const one = $('tabsOne'), mix = $('tabsMix'); one.innerHTML = ''; mix.innerHTML = '';
    TABS.forEach(t => {
      const el = document.createElement('button');
      el.className = 'opt btn3d' + (t === tab ? ' sel' : '');
      el.textContent = t.label; el.setAttribute('aria-pressed', t === tab);
      el.addEventListener('click', () => { tab = t; renderTabs(); renderPreview(); });
      (t.fixed ? one : mix).appendChild(el);
    });
  }
  function renderCounts(){
    [...$('counts').children].forEach(c => { const on = +c.dataset.v === total; c.classList.toggle('sel', on); c.setAttribute('aria-pressed', on); });
  }
  $('counts').addEventListener('click', e => {
    const c = e.target.closest('button'); if(!c) return;
    total = +c.dataset.v; renderCounts(); renderPreview();
  });
  // 미리 보기: 고른 단계의 예시 문제
  const SAMPLE = {p1:6, p2:6, p3:6, p4:5, p5:4};
  function dotGroup(n, cls){
    if(n === 0){ const z = document.createElement('span'); z.className = 'dzero'; z.textContent = '없음'; return z; }
    const g = document.createElement('div'); g.className = 'dgroup';
    const cols = n <= 3 ? n : Math.ceil(n / 2);   // 숫자 바로 아래에 오도록 두 줄로
    g.style.gridTemplateColumns = 'repeat(' + cols + ', var(--d))';
    for(let i = 0; i < n; i++){ const d = document.createElement('div'); d.className = 'dot ' + cls; g.appendChild(d); }
    return g;
  }
  function renderPreview(){
    let pa, pb, desc;
    if(tab.fixed){ pa = SAMPLE[tab.id]; pb = tab.fixed; desc = '0부터 9까지 숫자에 ' + tab.fixed + '을(를) 더해요'.replace('을(를)', [1,3,6,7,8].includes(tab.fixed) ? '을' : '를'); }
    else if(tab.max === 5){ pa = 3; pb = 2; desc = '0부터 5까지 두 숫자를 더해요'; }
    else { pa = 7; pb = 5; desc = '0부터 9까지 두 숫자를 더해요'; }
    $('pvA').textContent = pa; $('pvB').textContent = pb; $('pvDesc').textContent = desc;
    $('pvSel').textContent = tabName(tab) + ' / ' + total + '문제';
    $('pvDotsA').replaceChildren(dotGroup(pa, 'a'));
    $('pvDotsB').replaceChildren(dotGroup(pb, 'b'));
  }
  function showRecord(){ const r = store.get('chae-add-record'); $('record').textContent = r ? '지난 기록: ' + r : ''; }

  function show(id){ ['home','play','result'].forEach(s => $(s).classList.toggle('on', s === id)); }
  function goHome(){ try{ speechSynthesis.cancel(); }catch(e){} document.querySelectorAll('.fx').forEach(f => f.remove()); clearTimeout(timer); timer = null; locked = false; renderTabs(); renderCounts(); renderPreview(); showRecord(); showTtsNote(); show('home'); }

  // ---------- 소리 ----------
  let ctx = null;
  function beep(freqs){
    try{
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      let t = ctx.currentTime;
      freqs.forEach(f => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(0.16, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
        o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + 0.2); t += 0.12;
      });
    }catch(e){}
  }
  // 종소리 한 번 (기본음 + 배음, 길게 울림)
  function bell(t, f, len, vol){
    [[1, vol], [2.01, vol * .35], [3.02, vol * .12]].forEach(([m, v]) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = m === 1 ? 'triangle' : 'sine'; o.frequency.value = f * m;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
      o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + len + 0.05);
    });
  }
  // "띵동~" + 반짝이는 상승음
  function dingDong(){
    try{
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      if(ctx.state === 'suspended') ctx.resume();
      const t = ctx.currentTime + 0.02;
      bell(t, 1318.5, 0.7, 0.22);          // 띵 (E6)
      bell(t + 0.26, 1046.5, 0.9, 0.22);   // 동 (C6)
      [1568, 2093, 2637, 3136].forEach((f, i) => bell(t + 0.62 + i * 0.06, f, 0.3, 0.06));
    }catch(e){}
  }
  // 음성 안내 (기기의 한국어 음성 사용)
  // - iOS/Safari는 첫 음성을 '터치하는 순간'에 시작해야 이후 음성이 나와서, 시작 버튼을 누를 때 한 번 깨워 둡니다.
  // - 크롬은 cancel() 직후 바로 speak()하면 말이 씹히는 경우가 있어 살짝 띄워서 말합니다.
  const TTS_OK = ('speechSynthesis' in window) && (typeof SpeechSynthesisUtterance !== 'undefined');
  let koVoice = null, ttsUnlocked = false, ttsFailed = false;
  // 여자 목소리 우선: 이름으로 고르고(유나·소라 등), 남자 목소리(민수 등)는 뒤로 미룸
  const FEMALE = /yuna|유나|sora|소라|seoyeon|서연|heami|sunhi|sun-hi|jiyun|jimin|yumi|female|woman|여성|google 한국/i;
  const MALE = /minsu|민수|jinho|injoon|inseo|hyunsu|male|man|남성|grandpa|eddy|reed|rocko|grandma|flo|sandy|shelley/i;
  function voiceScore(v){
    let sc = 0;
    if(FEMALE.test(v.name)) sc += 10;
    if(MALE.test(v.name) && !/female/i.test(v.name)) sc -= 20;
    if(/premium|enhanced|고품질|향상/i.test(v.name)) sc += 3;
    if(v.localService) sc += 1;
    return sc;
  }
  function pickVoice(){
    try{
      const ko = speechSynthesis.getVoices().filter(v => /^ko/i.test(v.lang));
      ko.sort((a, b) => voiceScore(b) - voiceScore(a));
      koVoice = ko[0] || null;
    }catch(e){}
  }
  if(TTS_OK){ try{ pickVoice(); speechSynthesis.addEventListener('voiceschanged', pickVoice); }catch(e){} }
  function makeUtter(text, vol){
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR'; if(koVoice) u.voice = koVoice;
    u.rate = 0.95; u.pitch = 1.2; u.volume = vol;
    u.onerror = ev => { if(ev && ev.error && ev.error !== 'interrupted' && ev.error !== 'canceled'){ ttsFailed = true; showTtsNote(); } };
    return u;
  }
  function unlockTTS(){
    if(!TTS_OK || ttsUnlocked) return;
    try{ pickVoice(); speechSynthesis.resume(); speechSynthesis.speak(makeUtter('시작', 0)); ttsUnlocked = true; }catch(e){}
  }
  function say(text, delay){
    if(!TTS_OK) return;
    try{
      if(speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();
      setTimeout(() => {
        try{ speechSynthesis.resume(); speechSynthesis.speak(makeUtter(text, 1)); }catch(e){ ttsFailed = true; }
      }, Math.max(60, delay || 0));
    }catch(e){ ttsFailed = true; }
  }
  function showTtsNote(){
    const el = $('ttsNote'); if(!el) return;
    if(!TTS_OK || ttsFailed) el.textContent = '이 화면에서는 음성 안내가 나오지 않아요. 효과음만 나와요.';
    else el.textContent = '';
  }

  // ---------- 문제 만들기 ----------
  const rand = n => Math.floor(Math.random() * n);           // 0..n-1
  function shuffle(arr){ for(let i = arr.length - 1; i > 0; i--){ const j = rand(i + 1); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }

  function makeProblem(){
    let pair;
    do{
      if(tab.fixed){ a = rand(10); b = tab.fixed; }           // 0~9 + N
      else { a = rand(tab.max + 1); b = rand(tab.max + 1); }   // 0~max + 0~max
      pair = a + ',' + b;
    } while(pair === lastPair);
    lastPair = pair; answer = a + b;
  }

  function makeChoices(){
    // 오답: 정답 ±1~±4, 0 이상, 겹치지 않게 4개
    const pool = [];
    for(let d = -4; d <= 4; d++){ const v = answer + d; if(d !== 0 && v >= 0) pool.push(v); }
    const list = shuffle(pool).slice(0, 4).concat(answer);
    // 무작위 순서, 정답이 연달아 같은 자리에 오지 않게
    do { shuffle(list); } while(list.indexOf(answer) === lastPos);
    lastPos = list.indexOf(answer);
    return list;
  }

  // 칭찬 · 격려 문구 (짧게, 같은 말이 연달아 나오지 않게)
  const PRAISE = ['정답!', '잘했어!', '맞았어!', '최고야!', '멋지다!', '딩동댕!', '우와, 대단해!'];
  const CHEER = ['다시 해 볼까?', '괜찮아, 한 번 더!', '할 수 있어!', '천천히 세어 봐.', '아깝다, 다시!'];
  const lastLine = {};
  function pickLine(list, key){
    let v; do { v = list[rand(list.length)]; } while(v === lastLine[key] && list.length > 1);
    lastLine[key] = v; return v;
  }
  const tabName = t => t.label + (t.fixed ? ' 하나씩 더하기' : ' 섞어서 더하기');

  // ---------- 문제 화면 ----------
  function start(){
    qi = 0; score = 0; wrongs = []; lastPair = ''; lastPos = -1;
    $('score').textContent = 0; show('play'); next();
  }

  function next(){
    timer = null; locked = false; firstTry = true;
    makeProblem(); opts = makeChoices();
    $('where').textContent = tabName(tab) + ' / ' + total + '문제';
    $('qcount').textContent = (qi + 1) + ' / ' + total;
    $('bar').style.width = (qi / total * 100) + '%';
    $('na').textContent = a; $('nb').textContent = b;
    $('ans').textContent = '?'; $('ans').classList.remove('done');
    $('card').classList.remove('good', 'bad', 'pop', 'shake');
    $('msg').textContent = ''; $('msg').className = 'msg';
    setHint(false);                                         // 새 문제는 힌트 숨김
    const box = $('choices'); box.innerHTML = '';
    opts.forEach((v, i) => {
      const el = document.createElement('button');
      el.className = 'choice btn3d'; el.textContent = v; el.dataset.v = v;
      el.setAttribute('aria-label', '보기 ' + (i + 1) + ': ' + v);
      el.addEventListener('click', () => pick(el));
      box.appendChild(el);
    });
  }

  // 힌트
  let hintOn = false;
  function drawDots(){
    $('dotsA').replaceChildren(dotGroup(a, 'a'));
    $('dotsB').replaceChildren(dotGroup(b, 'b'));
  }
  function setHint(on){
    hintOn = on;
    if(on) drawDots();
    $('dotsA').hidden = !on; $('dotsB').hidden = !on; $('dotsGap').hidden = !on;
    $('hintBtn').innerHTML = (on ? ICON.eyeOff : ICON.eye) + (on ? '힌트 숨기기' : '힌트 보기');
  }
  $('hintBtn').addEventListener('click', () => setHint(!hintOn));

  // 정답 축하 이펙트: 아래에서 폭죽이 올라가 터지고(A), 위에서 칭찬 리본이 내려옴(B)
  const FX_COLORS = ['#EC5A8A','#F28C38','#8F63E8','#B8DC3F','#78AEF0','#FFCC33'];
  const fxPick = arr => arr[Math.floor(Math.random() * arr.length)];
  const fxR = (a, b) => a + Math.random() * (b - a);
  function burst(text){
    let reduce = false; try{ reduce = matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
    document.querySelectorAll('.fx').forEach(f => f.remove());
    const fx = document.createElement('div'); fx.className = 'fx';
    const cv = document.createElement('canvas'); fx.appendChild(cv);
    const rb = document.createElement('div'); rb.className = 'ribbon';
    rb.innerHTML = '<i class="rb-tail l"></i><i class="rb-tail r"></i><i class="rb-fold l"></i><i class="rb-fold r"></i><span class="rb-band"></span>';
    rb.querySelector('.rb-band').textContent = text; fx.appendChild(rb);
    // 리본 자리: 진행 막대 아래 ~ 숫자 문제 위, 그 사이 가운데
    try{
      const barB = document.querySelector('.progress').getBoundingClientRect().bottom;
      const probT = document.querySelector('#play .problem').getBoundingClientRect().top;
      const gap = Math.max(0, probT - barB);
      const fs = Math.max(22, Math.min(64, gap * 0.42, innerWidth * 0.07));
      rb.style.fontSize = fs + 'px';
      document.body.appendChild(fx);
      let rh = rb.offsetHeight;                      // 실제 리본 높이
      if(rh > gap - 8 && fs > 22){ rb.style.fontSize = Math.max(22, fs * (gap - 8) / rh) + 'px'; rh = rb.offsetHeight; }
      rb.style.setProperty('--rt', Math.max(barB + 4, barB + (gap - rh) / 2) + 'px');
    }catch(e){}
    if(!fx.isConnected) document.body.appendChild(fx);
    const ctx = cv.getContext('2d'), dpr = Math.min(window.devicePixelRatio || 1, 2);
    const W = innerWidth, H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const g = H / 1800, size = Math.max(1, Math.min(W, H) / 300);
    let parts = [], t0 = performance.now(), last = t0;
    const explode = (x, y, n, speed, colors, extra) => {
      for(let i = 0; i < n; i++){
        const a = Math.PI * 2 * i / n + fxR(-.08, .08), v = speed * fxR(.55, 1);
        parts.push(Object.assign({x, y, vx:Math.cos(a) * v, vy:Math.sin(a) * v, g:g * .4, drag:.975, life:fxR(900, 1300), fade:500, s:fxR(1.8, 3) * size, c:fxPick(colors), tw:Math.random() < .4}, extra || {}));
      }
    };
    [[.2, 0], [.8, 160], [.5, 330], [.33, 600], [.67, 740]].forEach(([fxp, delay]) => {
      const col = [fxPick(FX_COLORS), fxPick(FX_COLORS)];
      parts.push({rocket:true, x:W * fxp, y:H, vx:fxR(-.4, .4), vy:-Math.sqrt(2 * g * H * fxR(.55, .72)), g, drag:1, life:4000, fade:4000, delay, s:3 * size, c:'#FFF6D6',
        pop:(x, y) => { explode(x, y, reduce ? 18 : 70, Math.min(W, H) / 42, col); if(!reduce) explode(x, y, 18, Math.min(W, H) / 84, ['#FFFFFF'], {tw:true, s:1.6 * size}); }});
    });
    function tick(now){
      const dt = Math.min(48, now - last); last = now; const k = dt / 16;
      ctx.clearRect(0, 0, W, H);
      const born = [];
      parts = parts.filter(p => p.life > 0);
      for(const p of parts){
        if(p.delay > 0){ p.delay -= dt; continue; }
        p.vx *= Math.pow(p.drag, k); p.vy = p.vy * Math.pow(p.drag, k) + p.g * k; p.x += p.vx * k; p.y += p.vy * k; p.life -= dt;
        const al = Math.max(0, Math.min(1, p.life / p.fade));
        ctx.globalAlpha = p.tw ? al * (0.6 + 0.4 * Math.sin(p.life / 40)) : al;
        ctx.fillStyle = p.c;
        if(p.rocket){
          ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, 7); ctx.fill();
          ctx.globalAlpha = .35; ctx.fillRect(p.x - p.s / 2, p.y, p.s, p.s * 6);
          if(p.vy > -1.2){ p.life = 0; born.push(p); }
        } else { ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, 7); ctx.fill(); }
      }
      born.forEach(p => p.pop(p.x, p.y));
      ctx.globalAlpha = 1;
      if((parts.length || born.length) && now - t0 < 4000) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
    setTimeout(() => fx.remove(), 2600);
  }
  function restart(el, cls){ el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }


  function pick(el){
    if(locked || el.disabled) return;
    const v = +el.dataset.v;
    if(v === answer){
      locked = true;
      if(firstTry){ score++; $('score').textContent = score; }
      el.classList.add('right'); el.insertAdjacentHTML('beforeend', '<span class="mark"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>');
      [...$('choices').children].forEach(c => { c.disabled = true; if(c !== el) c.classList.add('dim'); });
      $('ans').textContent = answer; $('ans').classList.add('done');
      const praise = pickLine(PRAISE, 'p');
      $('msg').textContent = praise; $('msg').className = 'msg ok';
      $('card').classList.remove('bad'); $('card').classList.add('good');
      burst(praise); dingDong(); say(praise, 650);
      timer = setTimeout(() => { qi++; if(qi >= total) finish(); else next(); }, 2000);
    } else {
      if(firstTry) wrongs.push(a + ' + ' + b + ' = ' + answer);
      firstTry = false;
      el.classList.add('wrong'); el.disabled = true; el.insertAdjacentHTML('beforeend', '<span class="mark"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></span>');
      const cheer = pickLine(CHEER, 'c');
      $('msg').textContent = cheer; $('msg').className = 'msg no';
      $('card').classList.add('bad'); restart($('card'), 'shake');
      setTimeout(() => $('card').classList.remove('bad'), 600);
      beep([392, 330]); say(cheer, 150);
      if(!hintOn) setHint(true);                               // 틀리면 힌트 자동 표시
    }
  }

  document.addEventListener('keydown', e => {
    if(!$('play').classList.contains('on')) return;
    if(/^[1-5]$/.test(e.key)){ const el = $('choices').children[+e.key - 1]; if(el) pick(el); }
  });

  // ---------- 결과 ----------
  function finish(){
    timer = null;
    document.querySelectorAll('.fx').forEach(f => f.remove());
    $('bar').style.width = '100%';
    const pct = score / total;
    $('resChip').textContent = tabName(tab) + ' / ' + total + '문제';
    $('resTitle').textContent = pct === 1 ? '대단해요!' : pct >= .7 ? '참 잘했어요!' : '조금만 더 연습해요!';
    $('resSub').textContent = pct === 1 ? total + '문제를 모두 한 번에 맞혔어요' : total + '문제 중 ' + score + '문제를 한 번에 맞혔어요';
    $('resStars').innerHTML = Array.from({length: total}, (_, i) => starSvg(i < score)).join('');
    $('resStars').setAttribute('aria-label', '별 ' + total + '개 중 ' + score + '개');
    const d = new Date();
    store.set('chae-add-record', (d.getMonth() + 1) + '/' + d.getDate() + ' · ' + tabName(tab) + ' / ' + total + '문제 중 ' + score + '개');
    beep([523, 659, 784, 1046]);
    show('result');
  }

  $('startBtn').addEventListener('click', () => { unlockTTS(); start(); });
  $('againBtn').addEventListener('click', () => { unlockTTS(); start(); });
  $('toHomeBtn').addEventListener('click', goHome);
  $('homeBtn').addEventListener('click', goHome);

  document.addEventListener('pointerdown', unlockTTS, {once:true});
  // 또미 인사: 처음 메인에 들어올 때 한 번만
  try{ const bt = $('brandTomi'); const go = () => bt.classList.add('hi'); if(bt.complete) requestAnimationFrame(go); else bt.addEventListener('load', go, {once:true}); }catch(e){}
  renderTabs(); renderCounts(); renderPreview(); showRecord(); showTtsNote();
})();
</script>
</body>
</html>
